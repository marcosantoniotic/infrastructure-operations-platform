---
- name: Apply operating system baseline
  hosts: platform
  gather_facts: true
  become: true
  roles:
    - role: rhel_baseline
    - role: docker_engine

- name: Deploy initial platform services
  hosts: platform
  gather_facts: false
  become: true
  roles:
    - role: traefik
    - role: cockpit
    - role: netbox
    - role: netbox_backup
    - role: zabbix
    - role: zabbix_backup
    - role: netbox_zabbix_sync
    - role: glpi
    - role: glpi_backup
    - role: zabbix_glpi_bridge
    - role: portainer
    - role: observability
    - role: observability_backup
    - role: cloudflare_tunnel
      when: cloudflare_tunnel_enabled | default(false) | bool
    - role: external_backup
      when: external_backup_enabled | default(false) | bool
