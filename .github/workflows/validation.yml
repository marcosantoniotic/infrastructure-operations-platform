---
name: Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and PowerShell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate-ansible-layout.ps1

      - name: Detect publication risks
        shell: pwsh
        run: ./scripts/validate-publication.ps1

      - name: Validate credential governance
        shell: pwsh
        run: ./scripts/validate-credential-governance.ps1

      - name: Validate pinned container images
        shell: pwsh
        run: ./scripts/validate-container-images.ps1

      - name: Validate container privilege policy
        shell: pwsh
        run: ./scripts/validate-container-privileges.ps1

      - name: Validate immutable GitHub Actions
        shell: pwsh
        run: ./scripts/validate-github-actions.ps1

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $errorsFound = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$parseErrors
            )
            foreach ($parseError in $parseErrors) {
              $errorsFound += "$($_.FullName): $($parseError.Message)"
            }
          }
          if ($errorsFound.Count -gt 0) {
            $errorsFound | Write-Error
            exit 1
          }

      - name: Test private validation configuration staging
        shell: pwsh
        run: ./scripts/tests/Test-ValidationConfiguration.ps1

      - name: Test optional network and installed-state safety filters
        shell: bash
        run: |
          python scripts/tests/test_validation_safety.py
          python scripts/tests/test_blackbox_tls.py
          python scripts/tests/test_netbox_vm_sync.py
          python scripts/tests/test_netbox_proxy.py
          python scripts/tests/test_unifi_ocsp_policy.py
          python scripts/tests/test_container_image_inventory.py
          ruby scripts/tests/test_validation_network.rb
          bash -n automation/scripts/Configure-ValidationInfrastructure.sh
          bash automation/scripts/Configure-ValidationInfrastructure.sh --validate-only 192.0.2.20/24 192.0.2.1 192.0.2.10
          if bash automation/scripts/Configure-ValidationInfrastructure.sh --validate-only 192.0.2.0/24 192.0.2.1 192.0.2.10; then
            echo 'Network address was not rejected.' >&2
            exit 1
          fi

      - name: Reject whitespace errors
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Test fictitious OCSP cryptographic fixtures (not collector acceptance)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r scripts/ci/requirements-unifi-ocsp-tests.txt
          mkdir -p .validation/ocsp-private
          python scripts/ci/create-unifi-ocsp-fixtures.py --destination .validation/ocsp-private/ci-fixtures
          IOP_OCSP_FIXTURE_DIR="$PWD/.validation/ocsp-private/ci-fixtures" python scripts/tests/test_unifi_ocsp_fixtures.py
          python scripts/tests/test_unifi_ocsp_durability.py

      - name: Generate sanitized inventory fixture
        shell: bash
        run: |
          ./scripts/inventory-host.sh \
            --source-json scripts/fixtures/sanitized-inventory-source.json \
            --output /tmp/sanitized-current-state.md
          grep -q "Inventário sanitizado" /tmp/sanitized-current-state.md
          grep -q "platform-validation" /tmp/sanitized-current-state.md
          jq '.network_address = (["192", "0", "2", "10"] | join("."))' \
            scripts/fixtures/sanitized-inventory-source.json \
            > /tmp/unsafe-inventory.json
          if ./scripts/inventory-host.sh \
            --source-json /tmp/unsafe-inventory.json \
            --output /tmp/unsafe-current-state.md; then
            echo "Unsafe inventory was not rejected." >&2
            exit 1
          fi

      - name: Validate HTTP 200 and 302 contracts
        shell: bash
        run: |
          python scripts/fixtures/http-contract-server.py &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in {1..10}; do
            curl --silent --fail http://localhost:18080/ok && break
            sleep 1
          done
          pwsh ./scripts/Test-HttpContract.ps1 \
            -ContractPath scripts/fixtures/http-contract.json \
            -EvidencePath /tmp/http-contract-evidence.json
          jq -e \
            '.passed == true and (.endpoints | length) == 2' \
            /tmp/http-contract-evidence.json

  service-artifacts:
    name: Ansible, Compose and Prometheus validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_ARTIFACT_DIR: /tmp/infrastructure-platform-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible-core==2.19.7

      - name: Install Ansible collections
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ansible-galaxy collection install \
              --requirements-file requirements.yml; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Validate all Ansible playbooks
        shell: bash
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check \
              --inventory inventories/example/hosts.yml \
              "$playbook"
          done

      - name: Render sanitized service artifacts
        run: >-
          ansible-playbook
          --inventory localhost,
          scripts/ci/render-validation-artifacts.yml

      - name: Test installed-state deployment refusal guards
        run: >-
          ansible-playbook
          --inventory localhost,
          scripts/ci/test-installed-guards.yml

      - name: Validate Compose and Prometheus artifacts
        run: ./scripts/ci/validate-service-artifacts.sh

  glpi-https:
    name: Isolated GLPI API and blackbox HTTPS migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install template renderer
        run: python -m pip install --disable-pip-version-check ansible-core==2.19.7
      - name: Exercise disposable migration, negative controls and rollback
        run: python scripts/ci/test-glpi-https.py

  unifi-ocsp:
    name: Isolated non-root UniFi OCSP collector acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact patched runtime and fixture-only image (no publication)
        run: |
          docker build -f containers/unifi-ocsp/Dockerfile -t iop-isolated/unpoller-ocsp:3.4.1-candidate .
          docker build -f containers/unifi-ocsp/Dockerfile.test -t iop-isolated/unpoller-ocsp:test .
          test "$(docker image inspect --format '{{.Config.User}}' iop-isolated/unpoller-ocsp:test)" = '10001:10001'
      - name: Run real TLS, verifier, transports, revocation and durability without network access
        shell: bash
        run: |
          mkdir -p .validation/ocsp-private
          sudo chown 10001:10001 .validation/ocsp-private
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1g --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/.validation/ocsp-private:/workspace/.validation/ocsp-private:rw" \
            -w /workspace --entrypoint /bin/sh iop-isolated/unpoller-ocsp:test -ec '
              test "$(id -u)" = 10001
              cmp /opt/iop/unifi_ocsp.py roles/observability/files/unifi_ocsp.py
              cmp /opt/iop/unifi-ap-counts.py roles/observability/files/unifi-ap-counts.py
              python scripts/ci/create-unifi-ocsp-fixtures.py --destination .validation/ocsp-private/collector-ci
              python scripts/tests/test_unifi_ocsp_durability.py
              python scripts/tests/test_unifi_ocsp_policy.py
              python scripts/ci/test-unifi-ocsp-connections.py --fixture .validation/ocsp-private/collector-ci --binary /usr/bin/unpoller
            '
