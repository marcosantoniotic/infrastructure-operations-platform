---
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: unifi
    static_configs:
      - targets: ["unifi-poller:9130"]

  - job_name: network-snmp
    metrics_path: /snmp
    static_configs:
      - targets: ["<NETWORK_DEVICE_IP>"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: applications
    metrics_path: /probe
    params:
      module: [http_services]
    static_configs:
      - targets:
          - "https://zabbix.<BASE_DOMAIN>"
          - "https://netbox.<BASE_DOMAIN>"
          - "https://grafana.<BASE_DOMAIN>"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
