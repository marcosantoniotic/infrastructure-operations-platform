---
- name: Exercise installed-state refusal guards against disposable local fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fixture_root: "{{ lookup('env', 'CI_ARTIFACT_DIR') }}/guard-tests"
  tasks:
    - name: Require an isolated fixture destination
      ansible.builtin.assert:
        that:
          - fixture_root.startswith('/tmp/')
          - fixture_root.endswith('/guard-tests')
    - name: Create fixture directory
      ansible.builtin.file:
        path: "{{ fixture_root }}"
        state: directory
        mode: '0700'
    - name: Test installed protection preservation and refusal
      ansible.builtin.include_tasks: test-installed-guard-case.yml
      loop:
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          absent: true
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          sites: []
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          vm_template: Linux by Zabbix agent active
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_PLATFORM_MAPPING_ENABLED: 'true', NETBOX_PLATFORM_MAP: '{"linux":"linux-active"}', NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'}}}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_PLATFORM_MAPPING_ENABLED: 'true', NETBOX_PLATFORM_MAP: '{"linux":"linux-active"}', NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'}}}}
          platforms: true
          platform_map: {linux: linux-active}
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_PLATFORM_MAPPING_ENABLED: 'true', NETBOX_PLATFORM_MAP: '{"linux":"linux-active"}', NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'}}}}
          platforms: true
          platform_map: {linux: linux-active}
          profiles: {linux-active: {group: Linux servers, template: Different}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_PLATFORM_MAPPING_ENABLED: 'true', NETBOX_PLATFORM_MAP: '{"linux":"linux-active"}', NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'}}}}
          platforms: true
          platform_map: {linux: linux-active, rhel: linux-active}
          profiles: {linux-active: {group: Linux servers, template: Linux active}, network-icmp: {group: Network devices, template: ICMP Ping}}
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_PLATFORM_MAPPING_ENABLED: 'true', NETBOX_PLATFORM_MAP: '{"linux":"linux-active"}', NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'}}}}
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: &field_installed
            services:
              netbox-zabbix-sync:
                environment:
                  NETBOX_PLATFORM_MAPPING_ENABLED: 'true'
                  NETBOX_PLATFORM_MAP: '{}'
                  NETBOX_PLATFORM_PROFILES: '{"linux-active":{"group":"Linux servers","template":"Linux active"}}'
                  NETBOX_PROFILE_SOURCE: custom-field
                  NETBOX_PROFILE_FIELD: monitoring_profile
                  NETBOX_PROFILE_CHOICE_SET: iop-monitoring-profiles
                  NETBOX_PROFILE_VALUES: '{"linux":"linux-active"}'
                  NETBOX_PROFILE_LABELS: '{"linux":"Linux"}'
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *field_installed
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          profile_source: custom-field
          profile_values: {linux: linux-active}
          profile_labels: {linux: Linux}
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *field_installed
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          profile_source: custom-field
          profile_field: changed_field
          profile_values: {linux: linux-active}
          profile_labels: {linux: Linux}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *field_installed
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          profile_source: custom-field
          profile_values: {linux: other}
          profile_labels: {linux: Linux}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *field_installed
          platforms: true
          profiles: {linux-active: {group: Linux servers, template: Linux active}}
          profile_source: custom-field
          profile_values: {linux: linux-active}
          profile_labels: {linux: Changed}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: &transitions_installed
            services:
              netbox-zabbix-sync:
                environment:
                  NETBOX_PROFILE_TRANSITIONS: '[{"from":"icmp","to":"windows"}]'
                  NETBOX_PROFILE_READY: '{"virtualization.virtualmachine:1":{"profile":"windows","hostid":"123"}}'
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *transitions_installed
          profile_transitions: [{from: icmp, to: windows}]
          profile_ready: {virtualization.virtualmachine:1: {profile: windows, hostid: '123'}}
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *transitions_installed
          profile_transitions: [{from: icmp, to: windows}]
          profile_ready: {virtualization.virtualmachine:1: {profile: windows, hostid: '999'}}
          # An attestation may be revoked/replaced. The runtime still requires
          # exact ownership/backreference/hostid and secure agent transport.
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: *transitions_installed
          profile_transitions: [{from: icmp, to: windows}]
          profile_ready: {}
          reject: false
        - role: glpi
          task: installed-guard.yml
          compose: {services: {glpi: {volumes: ['./security.ini:/usr/local/etc/php/conf.d/zzz-iop-security.ini:ro']}}}
          reject: true
        - role: glpi
          task: installed-guard.yml
          compose: {services: {glpi: {volumes: ['./security.ini:/usr/local/etc/php/conf.d/zzz-iop-security.ini:ro']}}}
          php: true
          reject: false
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./cookies.py:/etc/netbox/config/cookie-security.py:ro']}}}
          reject: true
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./cookies.py:/etc/netbox/config/cookie-security.py:ro']}}}
          cookies: true
          reject: false
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./proxy-boundary.py:/opt/netbox/netbox/netbox/granian.py:ro', './cookie-security.py:/etc/netbox/config/zz-iop-cookie-security.py:ro'], environment: {IOP_NETBOX_TRUSTED_PROXY_PEERS: '["192.0.2.10"]'}}}}
          cookies: true
          proxy: true
          peers: ['192.0.2.10']
          reject: false
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./proxy-boundary.py:/opt/netbox/netbox/netbox/granian.py:ro', './cookie-security.py:/etc/netbox/config/zz-iop-cookie-security.py:ro'], environment: {IOP_NETBOX_TRUSTED_PROXY_PEERS: '["192.0.2.10"]'}}}}
          cookies: true
          reject: true
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./proxy-boundary.py:/opt/netbox/netbox/netbox/granian.py:ro', './cookie-security.py:/etc/netbox/config/zz-iop-cookie-security.py:ro'], environment: {IOP_NETBOX_TRUSTED_PROXY_PEERS: '["192.0.2.10"]'}}}}
          cookies: true
          proxy: true
          peers: ['192.0.2.11']
          reject: true
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {external: true, name: ci-preserved-volume}}}
          reject: true
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {driver: local}}}
          reject: false
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {external: true, name: ci-intentionally-missing-volume}}}
          volume: ci-intentionally-missing-volume
          reject: true
        - role: traefik
          task: installed-guard.yml
          compose: {services: {traefik: {}, custom-pki: {}}}
          reject: true
        - role: traefik
          task: installed-guard.yml
          compose: {services: {traefik: {}}}
          reject: false
      loop_control:
        loop_var: scenario
        label: "{{ scenario.role }} expected refusal={{ scenario.reject }}"
