---
- name: Exercise installed-state refusal guards against disposable local fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fixture_root: "{{ lookup('env', 'CI_ARTIFACT_DIR') }}/guard-tests"
  tasks:
    - name: Require an isolated fixture destination
      ansible.builtin.assert:
        that:
          - fixture_root.startswith('/tmp/')
          - fixture_root.endswith('/guard-tests')
    - name: Create fixture directory
      ansible.builtin.file:
        path: "{{ fixture_root }}"
        state: directory
        mode: '0700'
    - name: Test installed protection preservation and refusal
      ansible.builtin.include_tasks: test-installed-guard-case.yml
      loop:
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          reject: false
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          sites: []
          reject: true
        - role: netbox_zabbix_sync
          task: installed-guard.yml
          compose: {services: {netbox-zabbix-sync: {environment: {NETBOX_INCLUDE_VMS: 'true', NETBOX_VM_GROUP: Virtual machines, NETBOX_VM_TEMPLATE: ICMP Ping, NETBOX_SITE_SLUGS: example-lab}}}}
          vms: true
          vm_template: Linux by Zabbix agent active
          reject: true
        - role: glpi
          task: installed-guard.yml
          compose: {services: {glpi: {volumes: ['./security.ini:/usr/local/etc/php/conf.d/zzz-iop-security.ini:ro']}}}
          reject: true
        - role: glpi
          task: installed-guard.yml
          compose: {services: {glpi: {volumes: ['./security.ini:/usr/local/etc/php/conf.d/zzz-iop-security.ini:ro']}}}
          php: true
          reject: false
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./cookies.py:/etc/netbox/config/cookie-security.py:ro']}}}
          reject: true
        - role: netbox
          task: installed-guard.yml
          compose: {services: {netbox: {volumes: ['./cookies.py:/etc/netbox/config/cookie-security.py:ro']}}}
          cookies: true
          reject: false
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {external: true, name: ci-preserved-volume}}}
          reject: true
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {driver: local}}}
          reject: false
        - role: zabbix
          task: mysql-volume-guard.yml
          compose: {volumes: {mysql_data: {external: true, name: ci-intentionally-missing-volume}}}
          volume: ci-intentionally-missing-volume
          reject: true
        - role: traefik
          task: installed-guard.yml
          compose: {services: {traefik: {}, custom-pki: {}}}
          reject: true
        - role: traefik
          task: installed-guard.yml
          compose: {services: {traefik: {}}}
          reject: false
      loop_control:
        loop_var: scenario
        label: "{{ scenario.role }} expected refusal={{ scenario.reject }}"
