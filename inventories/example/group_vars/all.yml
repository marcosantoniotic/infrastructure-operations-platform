---
# Platform identity
platform_hostname: srv01-validation
platform_timezone: America/Sao_Paulo

# RHEL baseline
rhel_apply_updates: false
rhel_reboot_after_updates: false
rhel_baseline_packages:
  - bash-completion
  - bind-utils
  - curl
  - git
  - jq
  - lsof
  - rsync
  - tar
  - unzip
  - vim-enhanced
  - wget

# SSH hardening is opt-in to prevent administrative lockout.
rhel_harden_ssh: false
rhel_ssh_allow_users: []

# Docker
docker_users:
  - "<ADMIN_USER>"
docker_compose_package: docker-compose-plugin-2.40.3-1.el9
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  live-restore: true

# NetBox standalone
netbox_project_dir: /opt/netbox
netbox_image: netboxcommunity/netbox:v4.5.10-4.0.2
netbox_postgres_image: postgres:18-alpine
netbox_valkey_image: valkey/valkey:9.0-alpine
netbox_bind_address: 127.0.0.1
netbox_http_port: 8000
netbox_allowed_hosts:
  - localhost
  - "netbox.<BASE_DOMAIN>"

# Secret values are supplied by the encrypted vault.yml file.
netbox_secret_key: "{{ vault_netbox_secret_key }}"
netbox_api_token_pepper: "{{ vault_netbox_api_token_pepper }}"
netbox_postgres_password: "{{ vault_netbox_postgres_password }}"
netbox_redis_password: "{{ vault_netbox_redis_password }}"
netbox_redis_cache_password: "{{ vault_netbox_redis_cache_password }}"
netbox_superuser_name: admin
netbox_superuser_email: "<ADMIN_EMAIL>"
netbox_superuser_password: "{{ vault_netbox_superuser_password }}"

netbox_enable_metrics: true
netbox_enable_traefik: false
netbox_traefik_hostname: "netbox.<BASE_DOMAIN>"
netbox_traefik_network: proxy

# NetBox backup
netbox_backup_root: /var/backups/infrastructure-platform/netbox
netbox_backup_retention_days: 14
netbox_backup_schedule: "*-*-* 02:30:00"
netbox_backup_run_now: false
netbox_backup_verify_restore: false

# Traefik ingress
traefik_project_dir: /opt/traefik
traefik_image: traefik:v3.7.1
traefik_socket_proxy_image: >-
  ghcr.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
traefik_bind_address: 127.0.0.1
traefik_http_port: 8080
traefik_https_port: 8443
traefik_metrics_port: 8082
traefik_dashboard_hostname: "traefik.<BASE_DOMAIN>"
traefik_dashboard_basic_auth: "<TRAEFIK_DASHBOARD_BASIC_AUTH>"
traefik_proxy_network: proxy
traefik_socket_network: socket-proxy
traefik_enable_https: false
traefik_redirect_http_to_https: false
traefik_enable_validation_service: false

# Zabbix monitoring
zabbix_project_dir: /opt/zabbix
zabbix_server_image: zabbix/zabbix-server-mysql:7.4.12-alpine
zabbix_web_image: zabbix/zabbix-web-nginx-mysql:7.4.12-alpine
zabbix_mysql_image: mysql:8.4.10-oraclelinux9
zabbix_database_name: zabbix
zabbix_database_user: zabbix
zabbix_database_password: "{{ vault_zabbix_database_password }}"
zabbix_database_root_password: "{{ vault_zabbix_database_root_password }}"
zabbix_admin_password: "{{ vault_zabbix_admin_password }}"
zabbix_timezone: America/Sao_Paulo
zabbix_web_bind_address: 127.0.0.1
zabbix_web_port: 8081
zabbix_server_bind_address: 127.0.0.1
zabbix_server_port: 10051
zabbix_enable_traefik: false
zabbix_traefik_hostname: "zabbix.<BASE_DOMAIN>"
zabbix_traefik_network: proxy

# Zabbix backup
zabbix_backup_project_dir: /opt/zabbix
zabbix_backup_root: /var/backups/infrastructure-platform/zabbix
zabbix_backup_retention_days: 14
zabbix_backup_schedule: "*-*-* 03:15:00"
zabbix_backup_mysql_service: mysql
zabbix_backup_server_service: zabbix-server
zabbix_backup_database_name: zabbix
zabbix_backup_mysql_image: mysql:8.4.10-oraclelinux9
zabbix_backup_run_now: false
zabbix_backup_verify_restore: false

# Observability backup
observability_backup_project_dir: /opt/observability
observability_backup_root: /var/backups/infrastructure-platform/observability
observability_backup_retention_days: 14
observability_backup_schedule: "*-*-* 03:45:00"
observability_backup_prometheus_image: prom/prometheus:v3.13.1
observability_backup_grafana_image: grafana/grafana:13.1.1
observability_backup_helper_image: alpine:3.23.3
observability_backup_run_now: false
observability_backup_verify_restore: false

# Encrypted external backup (OneDrive through rclone)
external_backup_enabled: false
external_backup_repository: "rclone:onedrive:infrastructure-operations-platform/restic"
external_backup_restic_password: "{{ vault_external_backup_restic_password }}"
external_backup_rclone_config: "{{ vault_external_backup_rclone_config }}"
external_backup_require_rclone: true
external_backup_schedule: "*-*-* 04:30:00"
external_backup_keep_daily: 14
external_backup_keep_weekly: 8
external_backup_keep_monthly: 3
external_backup_run_now: false
external_backup_sources:
  - /var/backups/infrastructure-platform/netbox
  - /var/backups/infrastructure-platform/zabbix
  - /var/backups/infrastructure-platform/observability

# Authorized maintenance window
maintenance_authorized: false
maintenance_change_reference: "not-authorized"
maintenance_apply_os_updates: true
maintenance_refresh_container_images: false
maintenance_reboot_if_required: true
maintenance_minimum_free_mb: 4096
maintenance_run_external_backup: false

# Portainer container management
portainer_project_dir: /opt/portainer
portainer_image: portainer/portainer-ce:2.39.5-alpine
portainer_admin_user: admin
portainer_admin_password: "{{ vault_portainer_admin_password }}"
portainer_bind_address: 127.0.0.1
portainer_http_port: 9000
portainer_enable_traefik: false
portainer_traefik_hostname: "portainer.<BASE_DOMAIN>"
portainer_traefik_network: proxy

# Native RHEL web console
cockpit_hostname: "cockpit.<BASE_DOMAIN>"
cockpit_enable_traefik: false
cockpit_direct_firewall_access: false
cockpit_login_title: Infrastructure Operations Platform
cockpit_listen_port: 9091

# Optional Cockpit backend published by Traefik
traefik_enable_cockpit: false
traefik_cockpit_hostname: "cockpit.<BASE_DOMAIN>"
traefik_cockpit_backend_url: https://host.containers.internal:9091

# Metrics and visualization
observability_project_dir: /opt/observability
observability_prometheus_image: prom/prometheus:v3.13.1
observability_grafana_image: grafana/grafana:13.1.1
observability_node_exporter_image: prom/node-exporter:v1.12.1
observability_cadvisor_image: ghcr.io/google/cadvisor:v0.60.5
observability_blackbox_image: prom/blackbox-exporter:v0.28.0
observability_alertmanager_image: prom/alertmanager:v0.32.1
observability_scrape_interval: 30s
observability_prometheus_retention_time: 30d
observability_prometheus_retention_size: 8GB
observability_prometheus_bind_address: 127.0.0.1
observability_prometheus_port: 9090
observability_alertmanager_enabled: false
observability_alertmanager_bind_address: 127.0.0.1
observability_alertmanager_port: 9093
observability_alertmanager_smtp_smarthost: smtp-relay.brevo.com:587
observability_alertmanager_smtp_from: "alerts@marnep.com.br"
observability_alertmanager_smtp_username: "<BREVO_SMTP_LOGIN>"
observability_alertmanager_smtp_password: "{{ vault_alertmanager_smtp_password }}"
observability_alertmanager_email_to: "alerts@marnep.com.br"
observability_alertmanager_critical_group_wait: 15s
observability_alertmanager_critical_repeat_interval: 4h
observability_alertmanager_warning_group_wait: 2m
observability_alertmanager_warning_repeat_interval: 12h
observability_grafana_bind_address: 127.0.0.1
observability_grafana_port: 3000
observability_grafana_admin_user: admin
observability_grafana_admin_password: "{{ vault_grafana_admin_password }}"
observability_blackbox_targets:
  - name: prometheus
    url: http://prometheus:9090/-/ready
  - name: grafana
    url: http://grafana:3000/api/health
  # Add targets only when their modules share the observability network.
  # - name: netbox
  #   url: http://netbox:8080/login/
  #   host_header: "netbox.<BASE_DOMAIN>"
observability_enable_traefik: false
observability_grafana_hostname: "grafana.<BASE_DOMAIN>"
observability_traefik_network: proxy
