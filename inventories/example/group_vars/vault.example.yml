---
# Copy this file as vault.yml inside the target inventory, replace every
# placeholder and encrypt it with ansible-vault before the first execution.
vault_netbox_secret_key: "<NETBOX_SECRET_KEY>"
vault_netbox_api_token_pepper: "<NETBOX_API_TOKEN_PEPPER>"
vault_netbox_postgres_password: "<POSTGRES_PASSWORD>"
vault_netbox_redis_password: "<REDIS_PASSWORD>"
vault_netbox_redis_cache_password: "<REDIS_CACHE_PASSWORD>"
vault_netbox_superuser_password: "<NETBOX_ADMIN_PASSWORD>"
vault_zabbix_database_password: "<ZABBIX_DATABASE_PASSWORD>"
vault_zabbix_database_root_password: "<ZABBIX_DATABASE_ROOT_PASSWORD>"
vault_zabbix_admin_password: "<ZABBIX_ADMIN_PASSWORD>"
