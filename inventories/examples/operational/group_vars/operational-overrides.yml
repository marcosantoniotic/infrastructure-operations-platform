---
# Policy deltas required by the operational workflow. The initializer generates
# the complete private main.yml from inventories/example/group_vars/all/main.yml,
# changes the platform hostname to iop-ops-platform-01 and preserves these safe
# defaults from the canonical catalog.

# Safe cutover defaults already present in the canonical variable catalog.
observability_alertmanager_enabled: false
external_backup_enabled: false
maintenance_authorized: false
netbox_zabbix_sync_enabled: false

netbox_enable_traefik: false
zabbix_enable_traefik: false
portainer_enable_traefik: false
observability_enable_traefik: false
cockpit_enable_traefik: false
traefik_enable_cockpit: false

netbox_backup_run_now: false
netbox_backup_verify_restore: false
zabbix_backup_run_now: false
zabbix_backup_verify_restore: false
observability_backup_run_now: false
observability_backup_verify_restore: false
external_backup_run_now: false
