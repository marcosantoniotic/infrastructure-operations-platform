---
- name: Validate Zabbix variables
  ansible.builtin.assert:
    that:
      - zabbix_project_dir.startswith("/")
      - zabbix_database_password | length >= 24
      - not zabbix_database_password.startswith("<")
      - zabbix_database_root_password | length >= 24
      - not zabbix_database_root_password.startswith("<")
      - zabbix_admin_password | length >= 16
      - not zabbix_admin_password.startswith("<")
      - zabbix_admin_password != zabbix_default_admin_password
      - not (zabbix_agent2_enabled | bool) or zabbix_agent2_server_active | length > 0
      - not (zabbix_agent2_enabled | bool) or zabbix_agent2_template_name | length > 0
      - zabbix_server_bind_address in ['127.0.0.1', '::1']
      - >-
        not (zabbix_enable_traefik | bool) or
        zabbix_traefik_hostname | length > 0
    fail_msg: >-
      Replace all Zabbix placeholders with strong Ansible Vault values,
      configure a hostname before enabling Traefik, and keep the server listener
      bound to loopback. Remote agent ingress requires a separately reviewed
      proxy or firewall design.
  no_log: true

- name: Install the Zabbix 7.4 repository definition
  ansible.builtin.dnf:
    name: "{{ zabbix_agent2_release_package }}"
    state: present
    disable_gpg_check: true
  when: zabbix_agent2_enabled | bool

- name: Install Zabbix Agent 2 directly on the platform host
  ansible.builtin.dnf:
    name: zabbix-agent2
    state: present
  when: zabbix_agent2_enabled | bool

- name: Configure active-only Zabbix Agent 2 collection
  ansible.builtin.template:
    src: zabbix-agent2-platform.conf.j2
    dest: /etc/zabbix/zabbix_agent2.d/90-platform.conf
    owner: root
    group: zabbix
    mode: "0640"
  register: zabbix_agent2_configuration
  when: zabbix_agent2_enabled | bool

- name: Enable and start Zabbix Agent 2
  ansible.builtin.systemd:
    name: zabbix-agent2
    enabled: true
    state: started
  when: zabbix_agent2_enabled | bool

- name: Restart Zabbix Agent 2 after configuration changes
  ansible.builtin.systemd:
    name: zabbix-agent2
    state: restarted
  when:
    - zabbix_agent2_enabled | bool
    - zabbix_agent2_configuration.changed

- name: Validate Docker service
  ansible.builtin.service_facts: {}

- name: Assert Docker is running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - ansible_facts.services.get('docker.service', {}).get('state', '') == 'running'
    fail_msg: "Docker must be installed and running before Zabbix deployment."

- name: Verify the external Traefik network exists
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ zabbix_traefik_network }}"
  changed_when: false
  when:
    - zabbix_enable_traefik | bool
    - not ansible_check_mode

- name: Create Zabbix project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ zabbix_project_dir }}"
      mode: "0750"
    - path: "{{ zabbix_project_dir }}/secrets"
      mode: "0700"

- name: Install Zabbix Compose secrets
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ zabbix_project_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: zabbix_database_password
      content: "{{ zabbix_database_password }}"
    - name: zabbix_database_root_password
      content: "{{ zabbix_database_root_password }}"
  no_log: true

- name: Render Zabbix Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ zabbix_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Validate rendered Zabbix Compose configuration
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ zabbix_project_dir }} config --quiet
  changed_when: false
  when: not ansible_check_mode

- name: Deploy Zabbix project
  community.docker.docker_compose_v2:
    project_src: "{{ zabbix_project_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    wait: true
    wait_timeout: 420
  when: not ansible_check_mode

- name: Wait for Zabbix frontend
  ansible.builtin.uri:
    url: "http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/"
    method: GET
    status_code: 200
  register: zabbix_web_response
  retries: 40
  delay: 5
  until: zabbix_web_response.status == 200
  when: not ansible_check_mode

- name: Test desired Zabbix administrator credential
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_admin_user }}"
        password: "{{ zabbix_admin_password }}"
      id: 1
    return_content: true
    status_code: 200
  register: zabbix_desired_login
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Authenticate with the initial Zabbix administrator credential
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_admin_user }}"
        password: "{{ zabbix_default_admin_password }}"
      id: 2
    return_content: true
    status_code: 200
  register: zabbix_initial_login
  no_log: true
  when:
    - not ansible_check_mode
    - zabbix_desired_login.json.result is not defined

- name: Replace the initial Zabbix administrator password
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_initial_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: user.update
      params:
        userid: "1"
        passwd: "{{ zabbix_admin_password }}"
        current_passwd: "{{ zabbix_default_admin_password }}"
      id: 3
    return_content: true
    status_code: 200
  register: zabbix_password_update
  changed_when: zabbix_password_update.json.result is defined
  failed_when: false
  retries: 10
  delay: 3
  until: zabbix_password_update.json.result is defined
  no_log: true
  when:
    - not ansible_check_mode
    - zabbix_desired_login.json.result is not defined

- name: Require successful Zabbix administrator password replacement
  ansible.builtin.assert:
    that:
      - zabbix_password_update.json.result is defined
    fail_msg: >-
      Zabbix API rejected the administrator password replacement:
      {{ zabbix_password_update.json.error | default(
        {'message': 'response did not contain a JSON-RPC result'}
      ) | to_json }}
  when:
    - not ansible_check_mode
    - zabbix_desired_login.json.result is not defined

- name: Validate the managed Zabbix administrator credential
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_admin_user }}"
        password: "{{ zabbix_admin_password }}"
      id: 4
    return_content: true
    status_code: 200
  register: zabbix_managed_login
  failed_when: zabbix_managed_login.json.result is not defined
  no_log: true
  when: not ansible_check_mode

- name: Install managed Zabbix platform map provisioner
  ansible.builtin.template:
    src: provision-platform-map.py.j2
    dest: /usr/local/sbin/provision-zabbix-platform-map
    owner: root
    group: root
    mode: "0750"
  when: zabbix_provision_platform_map | bool

- name: Provision monitored services and Zabbix platform map
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/provision-zabbix-platform-map
      - >-
        http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port
        }}/api_jsonrpc.php
      - "{{ zabbix_admin_user }}"
      - "{{ zabbix_platform_host_address }}"
  environment:
    ZABBIX_ADMIN_PASSWORD: "{{ zabbix_admin_password }}"
  register: zabbix_platform_map_provision
  changed_when: (zabbix_platform_map_provision.stdout | from_json).changed
  no_log: true
  when:
    - zabbix_provision_platform_map | bool
    - not ansible_check_mode

- name: Validate managed Zabbix platform map
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port
      }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_managed_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: map.get
      params:
        output:
          - sysmapid
          - name
        filter:
          name:
            - "{{ zabbix_platform_map_name }}"
        selectSelements:
          - selementid
        selectLinks:
          - linkid
      id: 40
    return_content: true
    status_code: 200
  register: zabbix_platform_map_validation
  failed_when: >-
    zabbix_platform_map_validation.json.result | length != 1 or
    zabbix_platform_map_validation.json.result[0].selements | length != 8 or
    zabbix_platform_map_validation.json.result[0].links | length != 7
  no_log: true
  when:
    - zabbix_provision_platform_map | bool
    - not ansible_check_mode

- name: Wait for an active Zabbix Agent 2 host metric
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port
      }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_managed_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: item.get
      params:
        output:
          - itemid
          - key_
          - lastclock
          - lastvalue
          - state
          - error
        hostids:
          - "{{ (zabbix_platform_map_provision.stdout | from_json).hostid }}"
        filter:
          key_:
            - system.uptime
      id: 41
    return_content: true
    status_code: 200
  register: zabbix_agent2_metric_validation
  retries: 30
  delay: 5
  until: >-
    zabbix_agent2_metric_validation.json.result | default([]) | length == 1 and
    zabbix_agent2_metric_validation.json.result[0].lastclock | default('0') | int > 0 and
    zabbix_agent2_metric_validation.json.result[0].state | default('1') == '0'
  failed_when: false
  no_log: true
  when:
    - zabbix_agent2_enabled | bool
    - zabbix_provision_platform_map | bool
    - not ansible_check_mode

- name: Require successful active Zabbix Agent 2 collection
  ansible.builtin.assert:
    that:
      - zabbix_agent2_metric_validation.json.result | default([]) | length == 1
      - zabbix_agent2_metric_validation.json.result[0].lastclock | int > 0
      - zabbix_agent2_metric_validation.json.result[0].state == '0'
    fail_msg: >-
      Zabbix Agent 2 did not deliver the expected active system.uptime metric.
  no_log: true
  when:
    - zabbix_agent2_enabled | bool
    - zabbix_provision_platform_map | bool
    - not ansible_check_mode

- name: Assert the initial Zabbix administrator credential is rejected
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_admin_user }}"
        password: "{{ zabbix_default_admin_password }}"
      id: 5
    return_content: true
    status_code: 200
  register: zabbix_default_login_check
  failed_when: zabbix_default_login_check.json.result is defined
  no_log: true
  when: not ansible_check_mode

- name: Close the Zabbix API validation session
  ansible.builtin.uri:
    url: >-
      http://{{ zabbix_web_validation_host }}:{{ zabbix_web_port }}/api_jsonrpc.php
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_managed_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: user.logout
      params: []
      id: 6
    return_content: true
    status_code: 200
  register: zabbix_logout
  failed_when: zabbix_logout.json.result | default(false) != true
  no_log: true
  when: not ansible_check_mode

- name: Validate Zabbix Server listener
  ansible.builtin.wait_for:
    host: "{{ zabbix_server_validation_host }}"
    port: "{{ zabbix_server_port }}"
    state: started
    timeout: 30
  when: not ansible_check_mode

- name: Inspect Zabbix Server published listener
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ zabbix_project_dir }}
      port zabbix-server 10051
  register: zabbix_server_published_listener
  changed_when: false
  when: not ansible_check_mode

- name: Require loopback-only Zabbix Server publication
  ansible.builtin.assert:
    that:
      - >-
        zabbix_server_published_listener.stdout ==
        zabbix_server_bind_address ~ ':' ~ (zabbix_server_port | string)
    fail_msg: >-
      The Zabbix Server listener is not restricted to the configured loopback
      address.
  when: not ansible_check_mode

- name: Validate Zabbix through Traefik HTTPS
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --insecure
      - --include
      - --resolve
      - "{{ zabbix_traefik_hostname }}:{{ zabbix_traefik_https_port }}:{{ zabbix_traefik_validation_address }}"
      - "https://{{ zabbix_traefik_hostname }}:{{ zabbix_traefik_https_port }}/"
  register: zabbix_traefik_response
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    'http/1.1 200' in zabbix_traefik_response.stdout | lower or
    'http/2 200' in zabbix_traefik_response.stdout | lower
  failed_when: >-
    (
      'http/1.1 200' not in zabbix_traefik_response.stdout | lower and
      'http/2 200' not in zabbix_traefik_response.stdout | lower
    ) or
    'x-content-type-options: nosniff' not in
    zabbix_traefik_response.stdout | lower or
    'strict-transport-security: max-age=31536000' not in
    zabbix_traefik_response.stdout | lower
  when:
    - zabbix_enable_traefik | bool
    - not ansible_check_mode

- name: Report Zabbix deployment
  ansible.builtin.debug:
    msg:
      project_directory: "{{ zabbix_project_dir }}"
      frontend_fallback: >-
        http://{{ zabbix_web_bind_address }}:{{ zabbix_web_port }}
      server_listener: >-
        {{ zabbix_server_bind_address }}:{{ zabbix_server_port }}
      traefik_enabled: "{{ zabbix_enable_traefik | bool }}"
      traefik_hostname: >-
        {{ zabbix_traefik_hostname if zabbix_enable_traefik else 'disabled' }}
