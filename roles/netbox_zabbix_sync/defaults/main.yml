---
netbox_zabbix_sync_enabled: false
netbox_zabbix_sync_project_dir: /opt/netbox-zabbix-sync
netbox_zabbix_sync_image: netboxcommunity/netbox:v4.6.10-5.0.2
netbox_zabbix_sync_interval: 60
netbox_zabbix_sync_api_token: "<ZABBIX_API_TOKEN>"
netbox_zabbix_sync_zabbix_url: http://zabbix-web:8080/api_jsonrpc.php
netbox_zabbix_sync_group: Linux servers
netbox_zabbix_sync_template: Linux by Zabbix agent active
netbox_zabbix_sync_include_vms: false
netbox_zabbix_sync_vm_group: Virtual machines
netbox_zabbix_sync_vm_template: ""
netbox_zabbix_sync_platform_mapping_enabled: false
netbox_zabbix_sync_platform_map: {}
netbox_zabbix_sync_platform_profiles: {}
netbox_zabbix_sync_profile_source: platform
netbox_zabbix_sync_profile_field: monitoring_profile
netbox_zabbix_sync_profile_field_label: Perfil de monitoramento
netbox_zabbix_sync_profile_choice_set: iop-monitoring-profiles
netbox_zabbix_sync_profile_values: {}
netbox_zabbix_sync_profile_labels: {}
netbox_zabbix_sync_manage_profile_field: false
# Opt-in, additive transitions only. Readiness is an operator attestation after
# validating the real active agent and its encrypted transport, not an OS guess.
netbox_zabbix_sync_profile_transitions: []
netbox_zabbix_sync_profile_ready: {}
# Dedicated visualization groups only; catalogue must already exist.
netbox_zabbix_sync_technical_groups_enabled: false
netbox_zabbix_sync_technical_groups: {}
netbox_zabbix_sync_site_slugs: []
netbox_zabbix_sync_tag_slug: zabbix
netbox_zabbix_sync_hostid_field: zabbix_hostid
netbox_zabbix_sync_netbox_env_file: /opt/netbox/.env
netbox_zabbix_sync_netbox_network: netbox_backend
netbox_zabbix_sync_zabbix_network: zabbix_backend

iop_internal_api_tls_network: ""
iop_internal_api_ca_certificate: ""
