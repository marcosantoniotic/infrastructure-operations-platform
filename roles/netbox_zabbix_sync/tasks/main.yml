---
- name: Protect installed API TLS and synchronization selection settings
  ansible.builtin.import_tasks: installed-guard.yml
  when: netbox_zabbix_sync_enabled | bool
- name: Validate NetBox-Zabbix synchronization settings
  ansible.builtin.assert:
    that:
      - netbox_zabbix_sync_interval | int >= 30
      - netbox_zabbix_sync_api_token | string | length >= 16
      - not (netbox_zabbix_sync_api_token | string).startswith('<')
      - netbox_zabbix_sync_zabbix_url | length > 0
      - netbox_zabbix_sync_group | length > 0
      - netbox_zabbix_sync_template | length > 0
      - not (netbox_zabbix_sync_include_vms | bool) or netbox_zabbix_sync_vm_template | length > 0
      - not (netbox_zabbix_sync_include_vms | bool) or netbox_zabbix_sync_vm_group | length > 0
      - netbox_zabbix_sync_site_slugs is sequence and netbox_zabbix_sync_site_slugs is not string
      - netbox_zabbix_sync_platform_map is mapping
      - netbox_zabbix_sync_platform_profiles is mapping
      - netbox_zabbix_sync_profile_source in ['platform', 'custom-field']
      - netbox_zabbix_sync_profile_values is mapping
      - netbox_zabbix_sync_profile_labels is mapping
      - netbox_zabbix_sync_profile_transitions is sequence and netbox_zabbix_sync_profile_transitions is not string and netbox_zabbix_sync_profile_transitions is not mapping
      - netbox_zabbix_sync_profile_ready is mapping
      - netbox_zabbix_sync_technical_groups is mapping
      - (netbox_zabbix_sync_technical_groups_enabled | bool) or not netbox_zabbix_sync_technical_groups
      - not (netbox_zabbix_sync_technical_groups_enabled | bool) or (netbox_zabbix_sync_profile_source == 'custom-field' and netbox_zabbix_sync_platform_mapping_enabled | bool)
      - not (netbox_zabbix_sync_technical_groups_enabled | bool) or (netbox_zabbix_sync_technical_groups.keys() | list | sort == netbox_zabbix_sync_platform_profiles.keys() | list | sort)
      - not (netbox_zabbix_sync_technical_groups_enabled | bool) or (netbox_zabbix_sync_technical_groups.values() | list | unique | length == netbox_zabbix_sync_technical_groups | length)
      - not netbox_zabbix_sync_profile_transitions or netbox_zabbix_sync_profile_source == 'custom-field'
      - not netbox_zabbix_sync_profile_ready or netbox_zabbix_sync_profile_transitions | length > 0
      - netbox_zabbix_sync_profile_source != 'custom-field' or netbox_zabbix_sync_platform_mapping_enabled | bool
      - netbox_zabbix_sync_profile_source != 'custom-field' or (netbox_zabbix_sync_profile_values | length > 0 and netbox_zabbix_sync_profile_labels | length > 0)
      - netbox_zabbix_sync_profile_source != 'platform' or (not netbox_zabbix_sync_profile_values and not netbox_zabbix_sync_profile_labels and not netbox_zabbix_sync_manage_profile_field | bool)
      - (netbox_zabbix_sync_platform_mapping_enabled | bool) or (not netbox_zabbix_sync_platform_map and not netbox_zabbix_sync_platform_profiles)
      - not (netbox_zabbix_sync_platform_mapping_enabled | bool) or (netbox_zabbix_sync_platform_profiles | length > 0 and (netbox_zabbix_sync_profile_source == 'custom-field' or netbox_zabbix_sync_platform_map | length > 0))
    fail_msg: Review the NetBox-Zabbix synchronization variables and Vault token.
    quiet: true
  no_log: true
  when: netbox_zabbix_sync_enabled | bool

- name: Create NetBox-Zabbix synchronization directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ netbox_zabbix_sync_project_dir }}", mode: "0750"}
    - {path: "{{ netbox_zabbix_sync_project_dir }}/secrets", mode: "0700"}
  when: netbox_zabbix_sync_enabled | bool

- name: Store restricted Zabbix API token
  ansible.builtin.copy:
    content: "{{ netbox_zabbix_sync_api_token }}"
    dest: "{{ netbox_zabbix_sync_project_dir }}/secrets/zabbix_api_token"
    owner: root
    group: root
    mode: "0640"
  register: netbox_zabbix_sync_token_file
  no_log: true
  when: netbox_zabbix_sync_enabled | bool

- name: Validate optional internal TLS transport
  ansible.builtin.assert:
    that:
      - netbox_zabbix_sync_zabbix_url.startswith('https://')
      - iop_internal_api_tls_network is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - iop_internal_api_ca_certificate.startswith('-----BEGIN CERTIFICATE-----')
  when:
    - netbox_zabbix_sync_enabled | bool
    - iop_internal_api_tls_network | length > 0

- name: Store public CA for internal TLS clients
  ansible.builtin.copy:
    content: "{{ iop_internal_api_ca_certificate }}"
    dest: "{{ netbox_zabbix_sync_project_dir }}/internal-api-ca.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: netbox_zabbix_sync_tls_ca
  when:
    - netbox_zabbix_sync_enabled | bool
    - iop_internal_api_tls_network | length > 0

- name: Render NetBox-Zabbix synchronization artifacts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ netbox_zabbix_sync_project_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: compose.yaml.j2, dest: compose.yaml, mode: "0640"}
    - {src: netbox-zabbix-sync.py.j2, dest: netbox-zabbix-sync.py, mode: "0750"}
  register: netbox_zabbix_sync_artifacts
  when: netbox_zabbix_sync_enabled | bool

- name: Validate NetBox-Zabbix synchronization Compose project
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ netbox_zabbix_sync_project_dir }} config --quiet
  changed_when: false
  when:
    - netbox_zabbix_sync_enabled | bool
    - not ansible_check_mode

- name: Validate opt-in platform profile schema without API or database writes
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ netbox_zabbix_sync_project_dir }} run --rm
      netbox-zabbix-sync /opt/netbox/venv/bin/python
      /usr/local/libexec/netbox-zabbix-sync.py --validate-platform-config
  changed_when: false
  when:
    - netbox_zabbix_sync_enabled | bool
    - not ansible_check_mode

- name: Explicitly prepare monitoring selection field without seeding objects
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ netbox_zabbix_sync_project_dir }} run --rm
      netbox-zabbix-sync /opt/netbox/venv/bin/python
      /usr/local/libexec/netbox-zabbix-sync.py --prepare-monitoring-field
  register: netbox_zabbix_sync_field_preparation
  changed_when: (netbox_zabbix_sync_field_preparation.stdout_lines | last | from_json).created | bool
  when:
    - netbox_zabbix_sync_enabled | bool
    - netbox_zabbix_sync_profile_source == 'custom-field'
    - netbox_zabbix_sync_manage_profile_field | bool
    - not ansible_check_mode

- name: Preflight mapped hosts before replacing the scheduled synchronizer
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ netbox_zabbix_sync_project_dir }} run --rm
      netbox-zabbix-sync /opt/netbox/venv/bin/python
      /usr/local/libexec/netbox-zabbix-sync.py --verbose
  register: netbox_zabbix_sync_preflight
  failed_when: netbox_zabbix_sync_preflight.rc not in ([0, 2] if netbox_zabbix_sync_profile_transitions | length > 0 else [0])
  changed_when: false
  when:
    - netbox_zabbix_sync_enabled | bool
    - netbox_zabbix_sync_platform_mapping_enabled | bool
    - not ansible_check_mode

- name: Deploy NetBox-Zabbix synchronization
  community.docker.docker_compose_v2:
    project_src: "{{ netbox_zabbix_sync_project_dir }}"
    state: present
    pull: missing
    recreate: >-
      {{ 'always' if (
          netbox_zabbix_sync_token_file.changed | default(false) or
          netbox_zabbix_sync_artifacts.changed | default(false)
          or netbox_zabbix_sync_tls_ca.changed | default(false)
        ) else 'auto' }}
  when: netbox_zabbix_sync_enabled | bool

- name: Validate NetBox-Zabbix synchronization with a dry run
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ netbox_zabbix_sync_project_dir }} run --rm
      netbox-zabbix-sync /opt/netbox/venv/bin/python
      /usr/local/libexec/netbox-zabbix-sync.py
  register: netbox_zabbix_sync_dry_run
  failed_when: netbox_zabbix_sync_dry_run.rc not in ([0, 2] if netbox_zabbix_sync_profile_transitions | length > 0 else [0])
  changed_when: false
  register: netbox_zabbix_sync_validation
  retries: 10
  delay: 10
  until: netbox_zabbix_sync_validation.rc == 0
  when:
    - netbox_zabbix_sync_enabled | bool
    - not ansible_check_mode
