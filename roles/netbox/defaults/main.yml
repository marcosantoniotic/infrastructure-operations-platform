---
netbox_project_dir: /opt/netbox
netbox_image: netboxcommunity/netbox:v4.5.10-4.0.2
netbox_postgres_image: postgres:18-alpine
netbox_valkey_image: valkey/valkey:9.0-alpine
netbox_bind_address: 127.0.0.1
netbox_http_port: 8000
netbox_compose_wait_timeout: 900
netbox_healthcheck_start_period: 600s
netbox_allowed_hosts:
  - localhost
netbox_csrf_trusted_origins: []

netbox_database_name: netbox
netbox_database_user: netbox
netbox_secret_key: "<NETBOX_SECRET_KEY>"
netbox_api_token_pepper: "<NETBOX_API_TOKEN_PEPPER>"
netbox_postgres_password: "<POSTGRES_PASSWORD>"
netbox_redis_password: "<REDIS_PASSWORD>"
netbox_redis_cache_password: "<REDIS_CACHE_PASSWORD>"
netbox_superuser_name: admin
netbox_superuser_email: "<ADMIN_EMAIL>"
netbox_superuser_password: "<NETBOX_ADMIN_PASSWORD>"

netbox_enable_metrics: true
netbox_enable_traefik: false
netbox_traefik_hostname: "netbox.<BASE_DOMAIN>"
netbox_traefik_origin: "https://netbox.<BASE_DOMAIN>"
netbox_traefik_network: proxy
netbox_traefik_middlewares:
  - security-headers@file
netbox_traefik_validation_address: 127.0.0.1
netbox_traefik_https_port: 443
netbox_manage_firewall: false
netbox_validation_host: 127.0.0.1

# Demonstration data is opt-in and must only be enabled in disposable or
# publishable validation environments.
netbox_provision_demo_inventory: false
netbox_demo_site_name: Validation Facility
netbox_demo_cluster_name: Infrastructure Operations Validation
