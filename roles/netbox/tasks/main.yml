---
- name: Evaluate NetBox secret requirements without exposing values
  ansible.builtin.set_fact:
    netbox_secret_validation:
      - name: netbox_secret_key
        valid: >-
          {{ netbox_secret_key | default('') | string | length >= 50 and
             not (netbox_secret_key | default('') | string).startswith('<') }}
        requirement: at least 50 characters and no placeholder
      - name: netbox_api_token_pepper
        valid: >-
          {{ netbox_api_token_pepper | default('') | string | length >= 50 and
             not (netbox_api_token_pepper | default('') | string).startswith('<') }}
        requirement: at least 50 characters and no placeholder
      - name: netbox_postgres_password
        valid: >-
          {{ netbox_postgres_password | default('') | string | length >= 16 and
             not (netbox_postgres_password | default('') | string).startswith('<') }}
        requirement: at least 16 characters and no placeholder
      - name: netbox_redis_password
        valid: >-
          {{ netbox_redis_password | default('') | string | length >= 16 and
             not (netbox_redis_password | default('') | string).startswith('<') }}
        requirement: at least 16 characters and no placeholder
      - name: netbox_redis_cache_password
        valid: >-
          {{ netbox_redis_cache_password | default('') | string | length >= 16 and
             not (netbox_redis_cache_password | default('') | string).startswith('<') }}
        requirement: at least 16 characters and no placeholder
      - name: netbox_superuser_password
        valid: >-
          {{ netbox_superuser_password | default('') | string | length >= 16 and
             not (netbox_superuser_password | default('') | string).startswith('<') }}
        requirement: at least 16 characters and no placeholder
  no_log: true

- name: Validate NetBox secret requirements
  ansible.builtin.assert:
    that:
      - item.valid | bool
    fail_msg: "{{ item.name }} is invalid: {{ item.requirement }}."
    quiet: true
  loop: "{{ netbox_secret_validation }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate NetBox non-secret variables
  ansible.builtin.assert:
    that:
      - not netbox_superuser_email.startswith("<")
      - netbox_allowed_hosts | length > 0
      - >-
        not (netbox_enable_traefik | bool) or
        netbox_traefik_hostname in netbox_allowed_hosts
      - >-
        not (netbox_enable_traefik | bool) or
        netbox_traefik_origin in netbox_csrf_trusted_origins
    fail_msg: >-
      Review the NetBox email, allowed hosts, Traefik hostname and trusted
      origins. No placeholder may remain in the operational inventory.

- name: Validate Docker service
  ansible.builtin.service_facts: {}

- name: Assert Docker is running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - ansible_facts.services.get('docker.service', {}).get('state', '') == 'running'
    fail_msg: "Docker must be installed and running before NetBox deployment."

- name: Verify the external Traefik network exists
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ netbox_traefik_network }}"
  changed_when: false
  when:
    - netbox_enable_traefik | bool
    - not ansible_check_mode

- name: Create NetBox project directory
  ansible.builtin.file:
    path: "{{ netbox_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render NetBox environment
  ansible.builtin.template:
    src: netbox.env.j2
    dest: "{{ netbox_project_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render NetBox plugin requirements
  ansible.builtin.template:
    src: plugin-requirements.txt.j2
    dest: "{{ netbox_project_dir }}/plugin-requirements.txt"
    owner: root
    group: root
    mode: "0640"
  when: netbox_topology_views_enabled | bool
  register: netbox_plugin_requirements_result

- name: Render NetBox plugin configuration
  ansible.builtin.template:
    src: plugins.py.j2
    dest: "{{ netbox_project_dir }}/plugins.py"
    owner: root
    group: root
    mode: "0640"
  when: netbox_topology_views_enabled | bool
  register: netbox_plugin_configuration_result

- name: Render custom NetBox image
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ netbox_project_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0640"
  when: netbox_topology_views_enabled | bool
  register: netbox_custom_image_result

- name: Render NetBox Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ netbox_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Validate rendered Compose configuration
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ netbox_project_dir }} config --quiet
  changed_when: false
  when: not ansible_check_mode

- name: Deploy NetBox project
  community.docker.docker_compose_v2:
    project_src: "{{ netbox_project_dir }}"
    files:
      - compose.yaml
    state: present
    build: >-
      {{ 'always' if (
        netbox_topology_views_enabled | bool and
        (netbox_plugin_requirements_result.changed | default(false) or
         netbox_plugin_configuration_result.changed | default(false) or
         netbox_custom_image_result.changed | default(false))
      ) else 'policy' }}
    pull: missing
    wait: true
    wait_timeout: "{{ netbox_compose_wait_timeout }}"
  register: netbox_compose_result

- name: Wait for NetBox HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ netbox_validation_host }}:{{ netbox_http_port }}/login/"
    method: GET
    headers:
      Host: "{{ netbox_allowed_hosts | first }}"
    status_code:
      - 200
      - 302
    follow_redirects: safe
  register: netbox_http_result
  retries: 20
  delay: 10
  until: netbox_http_result.status in [200, 302]
  when: not ansible_check_mode

- name: Validate NetBox Topology Views package and configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ netbox_project_dir }}"
      - exec
      - -T
      - netbox
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - shell
      - -c
      - >-
        import importlib.metadata as m;
        from django.conf import settings;
        assert m.version('netbox-topology-views') == '{{ netbox_topology_views_version }}';
        assert 'netbox_topology_views' in settings.PLUGINS
  changed_when: false
  when:
    - netbox_topology_views_enabled | bool
    - not ansible_check_mode

- name: Validate that NetBox has no pending migrations
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ netbox_project_dir }}"
      - exec
      - -T
      - netbox
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - migrate
      - --check
  changed_when: false
  when:
    - netbox_topology_views_enabled | bool
    - not ansible_check_mode

- name: Install sanitized NetBox demonstration inventory provisioner
  ansible.builtin.template:
    src: provision-demo-inventory.py.j2
    dest: "{{ netbox_project_dir }}/provision-demo-inventory.py"
    owner: root
    group: root
    mode: "0640"
  when: netbox_provision_demo_inventory | bool

- name: Provision sanitized NetBox demonstration inventory
  ansible.builtin.shell:
    cmd: >-
      docker compose --project-directory {{ netbox_project_dir }} exec -T netbox
      python /opt/netbox/netbox/manage.py shell <
      {{ netbox_project_dir }}/provision-demo-inventory.py
  args:
    executable: /bin/bash
  register: netbox_demo_inventory_provision
  changed_when: >-
    (netbox_demo_inventory_provision.stdout_lines | last | from_json).changed
  when:
    - netbox_provision_demo_inventory | bool
    - not ansible_check_mode

- name: Validate sanitized NetBox demonstration inventory
  ansible.builtin.assert:
    that:
      - (netbox_demo_inventory_provision.stdout_lines | last | from_json).sites == 1
      - (netbox_demo_inventory_provision.stdout_lines | last | from_json).devices == 1
      - (netbox_demo_inventory_provision.stdout_lines | last | from_json).virtual_machines == 4
      - (netbox_demo_inventory_provision.stdout_lines | last | from_json).prefixes == 3
    fail_msg: Sanitized NetBox demonstration inventory is incomplete.
  when:
    - netbox_provision_demo_inventory | bool
    - not ansible_check_mode

- name: Validate NetBox through Traefik HTTPS
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --insecure
      - --include
      - --resolve
      - "{{ netbox_traefik_hostname }}:{{ netbox_traefik_https_port }}:{{ netbox_traefik_validation_address }}"
      - "https://{{ netbox_traefik_hostname }}:{{ netbox_traefik_https_port }}/login/"
  register: netbox_traefik_response
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    'http/1.1 200' in netbox_traefik_response.stdout | lower or
    'http/2 200' in netbox_traefik_response.stdout | lower
  failed_when: >-
    (
      'http/1.1 200' not in netbox_traefik_response.stdout | lower and
      'http/2 200' not in netbox_traefik_response.stdout | lower
    ) or
    'x-content-type-options: nosniff' not in
    netbox_traefik_response.stdout | lower or
    'strict-transport-security: max-age=31536000' not in
    netbox_traefik_response.stdout | lower
  when:
    - netbox_enable_traefik | bool
    - not ansible_check_mode

- name: Report NetBox deployment
  ansible.builtin.debug:
    msg:
      project_directory: "{{ netbox_project_dir }}"
      bind_address: "{{ netbox_bind_address }}"
      port: "{{ netbox_http_port }}"
      traefik_enabled: "{{ netbox_enable_traefik }}"
      traefik_hostname: >-
        {{ netbox_traefik_hostname if netbox_enable_traefik else 'disabled' }}
