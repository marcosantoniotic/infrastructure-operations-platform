---
- name: Validate Cockpit variables
  ansible.builtin.assert:
    that:
      - cockpit_hostname | length > 0
      - cockpit_packages | length > 0
      - >-
        cockpit_additional_hostnames | unique | list | length ==
        cockpit_additional_hostnames | length
      - cockpit_hostname not in cockpit_additional_hostnames
      - >-
        not (cockpit_admin_enabled | bool) or
        cockpit_admin_username is match('^[a-z_][a-z0-9_-]{2,31}$')
      - >-
        not (cockpit_admin_enabled | bool) or
        cockpit_admin_password_hash is match('^\\$(?:6|y)\\$')
      - >-
        not (cockpit_admin_enabled | bool) or
        'wheel' in cockpit_admin_groups

- name: Provision dedicated Cockpit administrator
  ansible.builtin.user:
    name: "{{ cockpit_admin_username }}"
    password: "{{ cockpit_admin_password_hash | trim }}"
    groups: "{{ cockpit_admin_groups }}"
    append: true
    create_home: true
    shell: /bin/bash
    password_lock: false
    state: present
  no_log: true
  when: cockpit_admin_enabled | bool

- name: Inspect dedicated Cockpit administrator status
  ansible.builtin.command:
    argv:
      - passwd
      - -S
      - "{{ cockpit_admin_username }}"
  register: cockpit_admin_password_status
  changed_when: false
  when: cockpit_admin_enabled | bool

- name: Inspect dedicated Cockpit administrator groups
  ansible.builtin.command:
    argv:
      - id
      - -nG
      - "{{ cockpit_admin_username }}"
  register: cockpit_admin_group_status
  changed_when: false
  when: cockpit_admin_enabled | bool

- name: Validate dedicated Cockpit administrator
  ansible.builtin.assert:
    that:
      - cockpit_admin_password_status.stdout.split()[1] in ['P', 'PS']
      - "'wheel' in cockpit_admin_group_status.stdout.split()"
  when: cockpit_admin_enabled | bool

- name: Install RHEL web console packages
  ansible.builtin.dnf:
    name: "{{ cockpit_packages }}"
    state: present

- name: Create Cockpit configuration directory
  ansible.builtin.file:
    path: /etc/cockpit
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Cockpit socket override directory
  ansible.builtin.file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure conflict-free Cockpit socket port
  ansible.builtin.template:
    src: listen.conf.j2
    dest: /etc/systemd/system/cockpit.socket.d/listen.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Cockpit socket

- name: Permit Cockpit socket port in SELinux policy
  community.general.seport:
    ports: "{{ cockpit_listen_port }}"
    proto: tcp
    setype: websm_port_t
    state: present

- name: Configure Cockpit for reverse proxy
  ansible.builtin.template:
    src: cockpit.conf.j2
    dest: /etc/cockpit/cockpit.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Cockpit socket

- name: Inspect rendered Cockpit origins
  ansible.builtin.command:
    argv:
      - grep
      - ^Origins =
      - /etc/cockpit/cockpit.conf
  register: cockpit_rendered_origins
  changed_when: false

- name: Validate rendered Cockpit origins
  ansible.builtin.assert:
    that:
      - "('https://' + item) in cockpit_rendered_origins.stdout.split()"
      - "('wss://' + item) in cockpit_rendered_origins.stdout.split()"
      - "'ProtocolHeader' not in cockpit_rendered_origins.stdout"
  loop: "{{ [cockpit_hostname] + cockpit_additional_hostnames }}"

- name: Enable Cockpit socket activation
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Cockpit configuration
  ansible.builtin.meta: flush_handlers

- name: Allow optional direct Cockpit firewall access
  ansible.posix.firewalld:
    service: cockpit
    permanent: true
    immediate: true
    state: enabled
  when: cockpit_direct_firewall_access | bool

- name: Validate Cockpit HTTPS endpoint
  ansible.builtin.uri:
    url: "https://{{ cockpit_validation_address }}:{{ cockpit_validation_port }}/ping"
    validate_certs: false
    status_code: 200
    return_content: true
  register: cockpit_ping
  retries: 20
  delay: 3
  until: cockpit_ping.status == 200

- name: Report Cockpit deployment
  ansible.builtin.debug:
    msg:
      socket: cockpit.socket
      direct_endpoint: >-
        https://{{ cockpit_validation_address }}:{{ cockpit_validation_port }}
      traefik_hostname: >-
        {{ cockpit_hostname if cockpit_enable_traefik else 'disabled' }}
      administrator: >-
        {{ cockpit_admin_username if cockpit_admin_enabled else 'not managed' }}
