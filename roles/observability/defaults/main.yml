---
observability_project_dir: /opt/observability
observability_textfile_collector_dir: /var/lib/node_exporter/textfile_collector
observability_prometheus_image: prom/prometheus:v3.13.1
observability_grafana_image: grafana/grafana:13.1.1
observability_node_exporter_image: prom/node-exporter:v1.12.1
observability_cadvisor_image: ghcr.io/google/cadvisor:v0.60.5
observability_blackbox_image: prom/blackbox-exporter:v0.28.0
observability_snmp_exporter_image: prom/snmp-exporter:v0.30.1
observability_unifi_poller_image: ghcr.io/unpoller/unpoller:v3.4.1
observability_alertmanager_image: prom/alertmanager:v0.32.1

observability_scrape_interval: 30s
observability_prometheus_retention_time: 30d
observability_prometheus_retention_size: 8GB
observability_prometheus_bind_address: 127.0.0.1
observability_prometheus_port: 9090
observability_alertmanager_bind_address: 127.0.0.1
observability_alertmanager_port: 9093
observability_alertmanager_enabled: false
observability_alertmanager_smtp_smarthost: smtp-relay.brevo.com:587
observability_alertmanager_smtp_from: "alerts@marnep.com.br"
observability_alertmanager_smtp_username: ""
observability_alertmanager_smtp_password: ""
observability_alertmanager_email_to: "alerts@marnep.com.br"
observability_alertmanager_critical_group_wait: 15s
observability_alertmanager_critical_repeat_interval: 4h
observability_alertmanager_warning_group_wait: 2m
observability_alertmanager_warning_repeat_interval: 12h
observability_grafana_bind_address: 127.0.0.1
observability_grafana_port: 3000
observability_grafana_admin_user: admin
observability_grafana_admin_password: "<GRAFANA_ADMIN_PASSWORD>"
observability_zabbix_enabled: false
observability_zabbix_network: zabbix_frontend
observability_zabbix_url: http://zabbix-web:8080/api_jsonrpc.php
observability_zabbix_datasource_uid: zabbix
observability_zabbix_username: Admin
observability_zabbix_password: ""
observability_grafana_validation_host: 127.0.0.1
observability_prometheus_validation_host: 127.0.0.1
observability_blackbox_targets:
  - name: prometheus
    url: http://prometheus:9090/-/ready
  - name: grafana
    url: http://grafana:3000/api/health
observability_blackbox_external_networks: []
observability_dns_targets: []
observability_adguard_metrics_enabled: false
observability_snmp_enabled: false
observability_snmp_auth_name: iop_snmp_v2
observability_snmp_community: "<SNMP_COMMUNITY>"
observability_snmp_modules:
  - system
  - if_mib
  - hrDevice
  - hrStorage
  - hrSystem
  - mikrotik
observability_snmp_module_concurrency: 3
observability_snmp_scrape_timeout: 25s
observability_snmp_targets: []
observability_unifi_poller_enabled: false
observability_unifi_url: "https://<UNIFI_CONTROLLER>"
observability_unifi_username: "<UNIFI_READ_ONLY_USER>"
observability_unifi_password: "<UNIFI_READ_ONLY_PASSWORD>"
observability_unifi_verify_ssl: true
observability_unifi_save_dpi: true

observability_enable_traefik: false
observability_grafana_hostname: "grafana.<BASE_DOMAIN>"
observability_traefik_network: proxy
observability_traefik_middlewares:
  - security-headers@file
observability_traefik_validation_address: 127.0.0.1
observability_traefik_https_port: 443
