---
- name: Validate observability variables
  ansible.builtin.assert:
    that:
      - observability_project_dir.startswith("/")
      - observability_textfile_collector_dir.startswith("/")
      - observability_grafana_admin_password | length >= 16
      - not observability_grafana_admin_password.startswith("<")
      - observability_prometheus_retention_time | length > 0
      - observability_prometheus_retention_size | length > 0
      - >-
        not (observability_enable_traefik | bool) or
        observability_grafana_hostname | length > 0
      - >-
        not (observability_alertmanager_enabled | bool) or
        (
          observability_alertmanager_smtp_username | length > 0 and
          observability_alertmanager_smtp_password | length >= 16 and
          not observability_alertmanager_smtp_password.startswith("<") and
          observability_alertmanager_smtp_from | length > 0 and
          observability_alertmanager_email_to | length > 0 and
          observability_alertmanager_critical_group_wait | length > 0 and
          observability_alertmanager_critical_repeat_interval | length > 0 and
          observability_alertmanager_warning_group_wait | length > 0 and
          observability_alertmanager_warning_repeat_interval | length > 0
        )
    fail_msg: >-
      Replace the Grafana password placeholder with a strong Ansible Vault
      value and configure retention and ingress variables.
  no_log: true

- name: Validate Docker service
  ansible.builtin.service_facts: {}

- name: Assert Docker is running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - ansible_facts.services.get('docker.service', {}).get('state', '') == 'running'
    fail_msg: "Docker must be installed and running before observability deployment."

- name: Verify the external Traefik network exists
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ observability_traefik_network }}"
  changed_when: false
  when:
    - observability_enable_traefik | bool
    - not ansible_check_mode

- name: Create observability project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ observability_project_dir }}"
      mode: "0750"
    - path: "{{ observability_project_dir }}/secrets"
      mode: "0700"
    - path: "{{ observability_project_dir }}/prometheus"
      mode: "0750"
    - path: "{{ observability_project_dir }}/alertmanager"
      mode: "0750"
    - path: "{{ observability_project_dir }}/blackbox"
      mode: "0750"
    - path: "{{ observability_project_dir }}/grafana"
      mode: "0750"
    - path: "{{ observability_project_dir }}/grafana/provisioning"
      mode: "0750"
    - path: "{{ observability_project_dir }}/grafana/provisioning/datasources"
      mode: "0750"
    - path: "{{ observability_project_dir }}/grafana/provisioning/dashboards"
      mode: "0750"
    - path: "{{ observability_project_dir }}/grafana/dashboards"
      mode: "0750"

- name: Create Node Exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ observability_textfile_collector_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Grafana administrator secret
  ansible.builtin.copy:
    content: "{{ observability_grafana_admin_password }}"
    dest: "{{ observability_project_dir }}/secrets/grafana_admin_password"
    owner: root
    group: root
    mode: "0644"
    unsafe_writes: true
  no_log: true

- name: Install Alertmanager SMTP secret
  ansible.builtin.copy:
    content: "{{ observability_alertmanager_smtp_password }}"
    dest: "{{ observability_project_dir }}/secrets/alertmanager_smtp_password"
    owner: "65534"
    group: "65534"
    mode: "0400"
    unsafe_writes: true
  no_log: true
  when: observability_alertmanager_enabled | bool

- name: Render observability configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ observability_project_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    unsafe_writes: true
  loop:
    - src: prometheus.yml.j2
      dest: prometheus/prometheus.yml
    - src: alerts.yml.j2
      dest: prometheus/alerts.yml
    - src: alertmanager.yml.j2
      dest: alertmanager/alertmanager.yml
    - src: blackbox.yml.j2
      dest: blackbox/blackbox.yml
    - src: grafana-datasource.yml.j2
      dest: grafana/provisioning/datasources/prometheus.yml
    - src: grafana-dashboards.yml.j2
      dest: grafana/provisioning/dashboards/platform.yml
    - src: infrastructure-host-containers.json.j2
      dest: grafana/dashboards/infrastructure-host-containers.json
    - src: application-tls-health.json.j2
      dest: grafana/dashboards/application-tls-health.json
    - src: backup-health.json.j2
      dest: grafana/dashboards/backup-health.json
    - src: dns-service-health.json.j2
      dest: grafana/dashboards/dns-service-health.json
  register: observability_rendered_configuration
  when: >-
    item.src != 'alertmanager.yml.j2' or
    observability_alertmanager_enabled | bool

- name: Render observability Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ observability_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"
    unsafe_writes: true

- name: Validate rendered observability Compose configuration
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ observability_project_dir }} config --quiet
  changed_when: false
  when: not ansible_check_mode

- name: Validate Prometheus configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/promtool
      - -v
      - "{{ observability_project_dir }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z"
      - -v
      - "{{ observability_project_dir }}/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z"
      - "{{ observability_prometheus_image }}"
      - check
      - config
      - /etc/prometheus/prometheus.yml
  changed_when: false
  when: not ansible_check_mode

- name: Validate Blackbox Exporter configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ observability_project_dir }}/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro,Z"
      - "{{ observability_blackbox_image }}"
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --config.check
  changed_when: false
  when: not ansible_check_mode

- name: Validate Alertmanager configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/amtool
      - -v
      - "{{ observability_project_dir }}/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z"
      - -v
      - "{{ observability_project_dir }}/secrets/alertmanager_smtp_password:/run/secrets/alertmanager_smtp_password:ro,Z"
      - "{{ observability_alertmanager_image }}"
      - check-config
      - /etc/alertmanager/alertmanager.yml
  changed_when: false
  when:
    - not ansible_check_mode
    - observability_alertmanager_enabled | bool

- name: Deploy observability project
  community.docker.docker_compose_v2:
    project_src: "{{ observability_project_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    wait: true
    wait_timeout: 420
  when: not ansible_check_mode

- name: Inspect Prometheus local port publication
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ observability_project_dir }}
      port prometheus 9090
  register: observability_prometheus_published_port
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Inspect Grafana local port publication
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ observability_project_dir }}
      port grafana 3000
  register: observability_grafana_published_port
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Inspect Alertmanager local port publication
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ observability_project_dir }}
      port alertmanager 9093
  register: observability_alertmanager_published_port
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - observability_alertmanager_enabled | bool

- name: Recreate configuration consumers after configuration changes
  ansible.builtin.shell:
    cmd: |
      set -o errexit -o nounset -o pipefail
      docker compose --project-directory {{ observability_project_dir }} \
        rm --stop --force grafana prometheus blackbox-exporter{{ ' alertmanager' if observability_alertmanager_enabled | bool else '' }}
      docker compose --project-directory {{ observability_project_dir }} \
        up --detach --force-recreate prometheus blackbox-exporter grafana{{ ' alertmanager' if observability_alertmanager_enabled | bool else '' }}
    executable: /bin/bash
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      observability_rendered_configuration.changed or
      observability_prometheus_published_port.stdout | trim | length == 0 or
      observability_grafana_published_port.stdout | trim | length == 0 or
      (
        observability_alertmanager_enabled | bool and
        observability_alertmanager_published_port.stdout | default('') | trim | length == 0
      )

- name: Reload Blackbox Exporter configuration
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ observability_project_dir }}
      kill --signal SIGHUP blackbox-exporter
  changed_when: false
  when: not ansible_check_mode

- name: Wait for Prometheus readiness before reload
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/-/ready
    method: GET
    status_code: 200
  register: observability_prometheus_pre_reload_ready
  retries: 30
  delay: 5
  until: observability_prometheus_pre_reload_ready.status == 200
  when: not ansible_check_mode

- name: Reload Prometheus configuration
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/-/reload
    method: POST
    status_code: 200
  when: not ansible_check_mode

- name: Wait for Alertmanager readiness
  ansible.builtin.uri:
    url: >-
      http://{{ observability_alertmanager_bind_address }}:{{ observability_alertmanager_port }}/-/ready
    method: GET
    status_code: 200
  register: observability_alertmanager_ready
  retries: 30
  delay: 5
  until: observability_alertmanager_ready.status == 200
  when:
    - not ansible_check_mode
    - observability_alertmanager_enabled | bool

- name: Reload Alertmanager configuration
  ansible.builtin.uri:
    url: >-
      http://{{ observability_alertmanager_bind_address }}:{{ observability_alertmanager_port }}/-/reload
    method: POST
    status_code: 200
  when:
    - not ansible_check_mode
    - observability_alertmanager_enabled | bool

- name: Validate Prometheus Alertmanager discovery
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/api/v1/alertmanagers
    method: GET
    status_code: 200
    return_content: true
  register: observability_prometheus_alertmanagers
  retries: 20
  delay: 5
  until: >-
    observability_prometheus_alertmanagers.json.status == 'success' and
    observability_prometheus_alertmanagers.json.data.activeAlertmanagers | length == 1
  when:
    - not ansible_check_mode
    - observability_alertmanager_enabled | bool

- name: Validate all Prometheus scrape targets
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/api/v1/targets?state=active
    method: GET
    status_code: 200
    return_content: true
  register: observability_prometheus_targets
  retries: 20
  delay: 5
  until: >-
    observability_prometheus_targets.json.status == 'success' and
    observability_prometheus_targets.json.data.activeTargets | length >= 3 and
    (
      observability_prometheus_targets.json.data.activeTargets |
      rejectattr('health', 'equalto', 'up') |
      list |
      length
    ) == 0
  failed_when: >-
    observability_prometheus_targets.json.status != 'success' or
    observability_prometheus_targets.json.data.activeTargets | length < 3 or
    (
      observability_prometheus_targets.json.data.activeTargets |
      rejectattr('health', 'equalto', 'up') |
      list |
      length
    ) > 0
  when: not ansible_check_mode

- name: Validate all configured application probes
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/api/v1/query?query=count(probe_success%7Bjob%3D%22blackbox-http%22%2Cmodule%3D%22%22%7D%20%3D%3D%201)
    method: GET
    status_code: 200
    return_content: true
  register: observability_blackbox_probes
  retries: 20
  delay: 5
  until: >-
    observability_blackbox_probes.json.status == 'success' and
    observability_blackbox_probes.json.data.result | length == 1 and
    observability_blackbox_probes.json.data.result[0].value[1] ==
    (observability_blackbox_targets | length | string)
  when: not ansible_check_mode

- name: Validate all configured DNS probes
  ansible.builtin.uri:
    url: >-
      http://{{ observability_prometheus_validation_host }}:{{ observability_prometheus_port }}/api/v1/query?query=count(probe_success%7Bjob%3D%22blackbox-dns%22%7D%20%3D%3D%201)
    method: GET
    status_code: 200
    return_content: true
  register: observability_dns_probes
  retries: 20
  delay: 5
  until: >-
    observability_dns_probes.json.status == 'success' and
    observability_dns_probes.json.data.result | length == 1 and
    observability_dns_probes.json.data.result[0].value[1] ==
    (observability_dns_targets | length | string)
  when:
    - not ansible_check_mode
    - observability_dns_targets | length > 0

- name: Wait for Grafana health endpoint
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/health
    method: GET
    status_code: 200
    return_content: true
  register: observability_grafana_health
  retries: 30
  delay: 5
  until: >-
    observability_grafana_health.status == 200 and
    observability_grafana_health.json.database == 'ok'
  when: not ansible_check_mode

- name: Validate provisioned Prometheus datasource
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/datasources/uid/prometheus
    method: GET
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: observability_grafana_datasource
  failed_when: >-
    observability_grafana_datasource.json.uid != 'prometheus' or
    observability_grafana_datasource.json.type != 'prometheus'
  no_log: true
  when: not ansible_check_mode

- name: Validate provisioned platform dashboard
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/dashboards/uid/infrastructure-host-containers
    method: GET
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: observability_grafana_dashboard
  failed_when: >-
    observability_grafana_dashboard.json.dashboard.uid !=
    'infrastructure-host-containers'
  no_log: true
  when: not ansible_check_mode

- name: Validate provisioned application health dashboard
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/dashboards/uid/application-tls-health
    method: GET
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: observability_application_dashboard
  failed_when: >-
    observability_application_dashboard.json.dashboard.uid !=
    'application-tls-health'
  no_log: true
  when: not ansible_check_mode

- name: Validate provisioned backup health dashboard
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/dashboards/uid/backup-health
    method: GET
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: observability_backup_dashboard
  failed_when: observability_backup_dashboard.json.dashboard.uid != 'backup-health'
  no_log: true
  when: not ansible_check_mode

- name: Validate provisioned DNS service dashboard
  ansible.builtin.uri:
    url: >-
      http://{{ observability_grafana_validation_host }}:{{ observability_grafana_port }}/api/dashboards/uid/dns-service-health
    method: GET
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: observability_dns_dashboard
  failed_when: observability_dns_dashboard.json.dashboard.uid != 'dns-service-health'
  no_log: true
  when: not ansible_check_mode

- name: Validate Grafana through Traefik HTTPS
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --insecure
      - --include
      - --resolve
      - "{{ observability_grafana_hostname }}:{{ observability_traefik_https_port }}:{{ observability_traefik_validation_address }}"
      - "https://{{ observability_grafana_hostname }}:{{ observability_traefik_https_port }}/login"
  register: observability_traefik_response
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    'http/1.1 200' in observability_traefik_response.stdout | lower or
    'http/2 200' in observability_traefik_response.stdout | lower
  failed_when: >-
    (
      'http/1.1 200' not in observability_traefik_response.stdout | lower and
      'http/2 200' not in observability_traefik_response.stdout | lower
    ) or
    'x-content-type-options: nosniff' not in
    observability_traefik_response.stdout | lower or
    'strict-transport-security: max-age=31536000' not in
    observability_traefik_response.stdout | lower
  when:
    - observability_enable_traefik | bool
    - not ansible_check_mode

- name: Report observability deployment
  ansible.builtin.debug:
    msg:
      project_directory: "{{ observability_project_dir }}"
      prometheus_fallback: >-
        http://{{ observability_prometheus_bind_address }}:{{ observability_prometheus_port }}
      grafana_fallback: >-
        http://{{ observability_grafana_bind_address }}:{{ observability_grafana_port }}
      alertmanager_fallback: >-
        {{ ('http://' + observability_alertmanager_bind_address + ':' +
            (observability_alertmanager_port | string))
           if observability_alertmanager_enabled else 'disabled' }}
      active_targets: >-
        {{ observability_prometheus_targets.json.data.activeTargets | length
           if not ansible_check_mode else 'not checked' }}
      grafana_hostname: >-
        {{ observability_grafana_hostname if observability_enable_traefik else 'disabled' }}
